plugins {
    id 'com.android.library'
    id 'jacoco'
}

android {
    namespace = 'com.example.common'
    compileSdk 36

    defaultConfig {
        minSdk 29
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

dependencies {
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.robolectric:robolectric:4.16'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

tasks.register('compileAidlNdk') {
    doLast {
        // Find the latest build-tools version
        def buildToolsDir = new File(android.sdkDirectory, 'build-tools')
        def buildToolsVersion = buildToolsDir.listFiles()
                .findAll { it.isDirectory() }
                .collect { it.name }
                .sort()
                .reverse()
                .find { it ==~ /\d+\.\d+\.\d+/ }

        def aidl = [android.sdkDirectory, 'build-tools', buildToolsVersion,
                    'aidl'].join(File.separator)

        def outDir = [projectDir.absolutePath, 'src', 'main', 'cpp', 'aidl'].join(File.separator)

        def headerOutDir = [projectDir.absolutePath, 'src', 'main', 'cpp', 'includes'].join(File.separator)

        def searchPathForImports = [projectDir.absolutePath, 'src', 'main', 'aidl'].join(File.separator)

        def aidlFile = [projectDir.absolutePath, 'src', 'main', 'aidl',
                        'com', 'example', "IMyService.aidl"].join(File.separator)

        exec {
            executable(aidl)
            args('--lang=ndk', '-o', outDir, '-h', headerOutDir, '-I', searchPathForImports, aidlFile)
        }

        // Fix generated code for NDK 26+ compatibility
        def generatedFile = new File(outDir, 'com/example/IMyService.cpp')
        if (generatedFile.exists()) {
            def content = generatedFile.text
            // Fix defineClass call (remove last 2 arguments)
            content = content.replaceAll(
                    /(\:\:ndk\:\:ICInterface\:\:defineClass\([^,]+,\s*[^,]+),\s*[^,]+,\s*\d+\)/,
                    '$1)'
            )
            // Fix asBinderReference() -> asBinder()
            content = content.replaceAll('asBinderReference', 'asBinder')
            generatedFile.text = content
        }
    }
}

afterEvaluate {
    preBuild.dependsOn(compileAidlNdk)
}

clean.doLast {
    def aidlCppOutDir = [projectDir.absolutePath, 'src', 'main', 'cpp', 'aidl'].join(File.separator)

    def aidlCppHeaderOutDir = [projectDir.absolutePath, 'src', 'main', 'cpp', 'includes',
                            'aidl'].join(File.separator)

    file(aidlCppOutDir).deleteDir()
    file(aidlCppHeaderOutDir).deleteDir()
}
